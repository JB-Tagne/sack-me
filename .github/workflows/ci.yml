# Sack Me! — CI on every push & pull request
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Sync game content check
        run: python scripts/sync_game_content.py --check
      - run: ruff check .

  unit:
    name: Unit + line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest unit (term-missing, fail-under)
        run: |
          pytest -q \
            tests/test_evaluate.py \
            tests/test_career.py \
            tests/test_demo_content.py \
            --cov=game_logic \
            --cov=demo_content \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=90 \
            -m "not integration and not benchmark"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sackme
          POSTGRES_PASSWORD: sackme
          POSTGRES_DB: sackme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sackme -d sackme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sackme:sackme@localhost:5432/sackme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply schema + seed
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          url = os.environ["DATABASE_URL"]
          with psycopg.connect(url) as conn:
              for name in ("schema.sql", "seed.sql"):
                  sql = (Path("sql") / name).read_text(encoding="utf-8")
                  with conn.cursor() as cur:
                      cur.execute(sql)
                  conn.commit()
                  print("OK", name)
          PY
      - name: Pytest integration
        run: pytest -q tests/test_db.py -m integration

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Bandit (SAST)
        run: bandit -q -r game_logic.py demo_content.py streamlit_app.py app.py scripts -x scripts/push_streamlit.sh,scripts/push_only.sh -ll
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Pytest security suite
        run: pytest -q tests/test_security.py
      - name: npm ci + audit
        run: |
          npm ci
          npm audit --audit-level=high

  performance:
    name: Performance / speed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Speed budgets + benchmarks
        run: |
          pytest -q tests/test_perf.py \
            --benchmark-only \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=on \
            --benchmark-disable-gc
      - name: Hard time budgets (non-benchmark)
        run: pytest -q tests/test_perf.py --benchmark-skip

  streamlit-smoke:
    name: Streamlit smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import streamlit_app; print('streamlit_app OK')"

  node:
    name: Node (unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Export TS tables to SQL
        run: npm run export:sql
      - name: Build React + Streamlit static site
        run: npm run build:streamlit
      - name: Assert Streamlit static exists
        run: test -f streamlit_static/index.html && test -f streamlit_static/sackme.html && test -f streamlit_static/VERSION

  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, unit, integration, security, performance, streamlit-smoke, node]
    steps:
      - run: echo "CI green — ready to merge/deploy"
