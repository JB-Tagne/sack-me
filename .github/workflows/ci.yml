# Sack Me! — CI on every push & pull request
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  node:
    name: Node (test + build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Export TS tables to SQL
        run: npm run export:sql
      - run: npm run build
      - run: npm audit --audit-level=high

  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - run: echo "CI green — ready to merge/deploy"
