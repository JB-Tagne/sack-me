# Pre-commit: automated checks on every local commit / push
# Install:
#   pip install -r requirements-dev.txt
#   pre-commit install
#   pre-commit install --hook-type pre-push
#   pre-commit install --hook-type commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: english-commit-msg
        name: Commit message must be English
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: sync-game-content
        name: Sync game content (catalog → SQL/demo/TS)
        entry: bash -c 'python scripts/sync_game_content.py --write && python scripts/sync_game_content.py --check && git add demo_content.py sql/seed.sql sql/migrations/999_sync_entities.sql src/data/dataStack/mutualisEntities.ts README.md tests/test_demo_content.py tests/test_db.py src/data/dataStack/roleContent.test.ts 2>/dev/null || true'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: unit-coverage
        name: Unit tests + line coverage
        entry: bash -c 'pytest -q tests/test_evaluate.py tests/test_career.py tests/test_demo_content.py --cov=game_logic --cov=demo_content --cov-fail-under=90 -m "not integration and not benchmark"'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: security-pytest
        name: Security pytest
        entry: bash -c 'pytest -q tests/test_security.py'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: bandit
        name: Bandit SAST
        entry: bash -c 'bandit -q -r game_logic.py demo_content.py streamlit_app.py app.py scripts -x scripts/push_streamlit.sh,scripts/push_only.sh,scripts/push_ci.sh -ll'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: perf-budgets
        name: Performance budgets
        entry: bash -c 'pytest -q tests/test_perf.py --benchmark-skip'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: full-unit-push
        name: Full unit suite (pre-push)
        entry: bash -c 'pytest -q tests/test_evaluate.py tests/test_career.py tests/test_demo_content.py tests/test_security.py --cov=game_logic --cov=demo_content --cov-fail-under=90'
        language: system
        pass_filenames: false
        stages: [pre-push]
