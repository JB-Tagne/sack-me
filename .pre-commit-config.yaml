# Pre-commit : tests automatiques à chaque commit local
# Install: pip install -r requirements-dev.txt && pre-commit install && pre-commit install --hook-type pre-push

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: unit-coverage
        name: Unit tests + line coverage
        entry: bash -c 'pytest -q tests/test_evaluate.py tests/test_career.py tests/test_demo_content.py --cov=game_logic --cov=demo_content --cov-fail-under=90 -m "not integration and not benchmark"'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: security-pytest
        name: Security pytest
        entry: bash -c 'pytest -q tests/test_security.py'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: bandit
        name: Bandit SAST
        entry: bash -c 'bandit -q -r game_logic.py demo_content.py streamlit_app.py app.py scripts -x scripts/push_streamlit.sh,scripts/push_only.sh -ll'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: perf-budgets
        name: Performance budgets
        entry: bash -c 'pytest -q tests/test_perf.py --benchmark-skip'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: full-unit-push
        name: Full unit suite (pre-push)
        entry: bash -c 'pytest -q tests/test_evaluate.py tests/test_career.py tests/test_demo_content.py tests/test_security.py --cov=game_logic --cov=demo_content --cov-fail-under=90'
        language: system
        pass_filenames: false
        stages: [pre-push]
