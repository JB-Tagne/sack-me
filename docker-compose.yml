# Sack Me! — PostgreSQL
services:
  db:
    image: postgres:16-alpine
    container_name: sackme-postgres
    environment:
      POSTGRES_USER: sackme
      POSTGRES_PASSWORD: sackme
      POSTGRES_DB: sackme
    ports:
      - "5432:5432"
    volumes:
      - sackme_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed_from_ts.sql:/docker-entrypoint-initdb.d/02_seed_from_ts.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/03_seed_mvp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sackme -d sackme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sackme_pgdata:
