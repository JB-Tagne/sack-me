[project]
name = "sack-me"
version = "1.0.0"
description = "Sack Me! — career simulation serious game (PM & data governance)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs live PostgreSQL (DATABASE_URL)",
  "security: security / secret / SAST-related tests",
  "benchmark: pytest-benchmark speed tests",
]
addopts = "-ra"

[tool.coverage.run]
source = ["game_logic", "demo_content"]
branch = true
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = [".venv", "node_modules", "tests"]
