:[`Rédiger le problème métier en 2–3 phrases`,`Lister max 3 KPI de succès`,`Définir le hors-scope explicite`,`Identifier owner produit et steward data`],trap:`Au-delà de 3 KPI, le MVP se dilue : le sponsor « veut tout » et plus rien n’est Done.`,steps:[{title:`Page & template`,detail:`Crée une page « Client 360 — Charter ». Sections : Problème, Users, KPI, Hors-scope, Risques, Décisions.`},{title:`Problème`,detail:`Formule : Qui souffre ? De quoi ? Impact mesurable. Ex. : « Les conseillers ouvrent 4 systèmes pour un même client → temps de préparation RDV ×2 ».`},{title:`KPI (max 3)`,detail:`Choisis des indicateurs actionnables (ex. % fiches complètes, temps moyen préparation RDV, NPS usage outil). Évite les vanity metrics.`},{title:`Hors-scope`,detail:`Liste ce qui n’est PAS dans le MVP (ex. scoring crédit temps réel, app mobile). Cela protège le délai.`}],questions:[{id:`n1q1`,prompt:`Combien de KPI de succès recommandés au maximum dans une charte MVP ?`,kind:`mcq`,options:[`1`,`3`,`10`,`Autant que le sponsor veut`],accept:[`3`],explanation:`3 KPI max force la priorisation. Au-delà, le MVP se dilue et on ne sait plus ce qui est « Done ».`},{id:`n1q2`,prompt:`Le hors-scope sert principalement à…`,kind:`mcq`,options:[`Remplir une case qualité`,`Protéger le délai et clarifier les attentes`,`Lister toutes les idées futures`,`Remplacer le backlog Jira`],accept:[`Protéger le délai et clarifier les attentes`],explanation:`Le hors-scope aligne le sponsor : ce qui n’est pas livré dans le MVP, pour éviter le scope creep.`},{id:`n1q3`,prompt:`Mot-clé d’une bonne formulation de problème (un mot) :`,kind:`short`,accept:[`impact`,`mesurable`,`utilisateur`,`users`,`douleur`,`pain`],explanation:`Un bon problème cite l’utilisateur et un impact mesurable (temps, coût, risque, qualité).`}],modelSolution:`Charte type : Problème (conseillers multi-systèmes, temps RDV ×2) · Users (conseillers, compliance) · KPI (temps prépa, % fiches complètes, adoption) · Hors-scope (scoring temps réel, mobile) · Owner produit + steward data nommés · Risques (qualité CRM, accès RGPD).`},{id:`jira-backlog-charter-2`,tool:`jira`,level:2,title:`Backlog Jira — data product lié à la charte`,context:`Après la charte Client 360, le PO data veut un backlog vivant partagé avec data engineers et analystes.`,description:`Tu structures le backlog Jira (epics / stories) pour suivre les items du produit data.`,tasks:[`Définir les champs essentiels (statut, priorité, KPI, owner)`,`Proposer 3 vues (board / sprint / roadmap)`,`Lier chaque item à un KPI de la charte`],trap:`Un item de backlog sans lien vers un KPI charter est souvent du travail décoratif — hors MVP.`,steps:[{title:`Structure`,detail:`Epic = outcome charter. Stories INVEST. Labels : KPI, phase (ingest/transform/expose), outil.`},{title:`Vues`,detail:`Board statut (flux), filtre sprint, timeline/roadmap pour le reporting direction.`},{title:`Règle`,detail:`Pas de story sans lien vers un KPI de la charte — sinon hors MVP.`}],questions:[{id:`n2q1`,prompt:`Propriété la plus critique pour éviter le travail « décoratif » :`,kind:`mcq`,options:[`Couleur`,`KPI lié`,`Emoji`,`Cover image`],accept:[`KPI lié`],explanation:`Si un item ne contribue à aucun KPI charter, il n’a pas sa place dans le MVP.`},{id:`n2q2`,prompt:`Nomme une vue utile pour le daily data (un mot : board / table / timeline) :`,kind:`short`,accept:[`board`,`kanban`,`table`],explanation:`Un board (ou table sprint) montre le flux du jour ; la timeline sert plutôt au reporting direction.`}],modelSolution:`Jira : Epics liés KPI charter · Stories avec AC · Labels outil/phase · Board statut + filtre sprint + roadmap. Règle : pas d’item sans KPI charter.`},{id:`conf-adr-1`,tool:`confluence`,level:1,title:`ADR — BigQuery vs Cloud SQL (mart finance)`,context:`Le mart finance doit servir 40 analystes (lecture lourde) et 2 apps opérationnelles (écriture transactionnelle légère).`,description:`Tu rédiges un Architecture Decision Record (ADR) pour trancher le stockage analytique.`,tasks:[`Rédiger Contexte, Options, Décision, Conséquences`,`Comparer BigQuery et Cloud SQL sur charge analytique`,`Documenter les trade-offs (coût, latence, ops)`],trap:`Choisir Cloud SQL « pour tout » saturera sous 40 analystes en scan large — sépare OLTP et analytique.`,steps:[{title:`Template ADR`,detail:`Titre, Statut (Proposed/Accepted), Contexte, Options (avec critères), Décision, Conséquences (+/−), Liens Jira.`},{title:`Critères`,detail:`Volume scan, concurrence lecteurs, coût €/TB, besoin transactions ACID, compétences équipe.`},{title:`Décision typique`,detail:`Analytique large → BigQuery ; OLTP / faible latence transactionnelle → Cloud SQL. Souvent les deux (OLTP → export → BQ).`}],questions:[{id:`c1q1`,prompt:`Pour 40 analystes scannant des historiques multi-années, l’option la plus adaptée est :`,kind:`mcq`,options:[`Cloud SQL seul`,`BigQuery (entrepôt)`,`CSV sur laptop`,`Redis`],accept:[`BigQuery (entrepôt)`],explanation:`BigQuery est conçu pour l’analytique à large scan ; Cloud SQL sature vite sous reporting concurrent.`},{id:`c1q2`,prompt:`Les 4 sections minimales d’un ADR (séparées par des virgules) :`,kind:`short`,accept:[`contexte, options, décision, conséquences`,`contexte, options, decision, consequences`],explanation:`ADR standard : Contexte → Options → Décision → Conséquences (positives et négatives).`}],modelSolution:`Décision type : Cloud SQL = source OLTP ; BigQuery = mart analytique. Conséquences : + perf analytique, + coût scan à maîtriser (partition/cluster) ; − latence near-real-time si batch uniquement.`},{id:`conf-runbook-2`,tool:`confluence`,level:2,title:`Runbook incident — pipeline finance en retard`,context:`Le DAG finance a 3 incidents « late » ce mois. Les ops demandent un runbook Confluence actionnable à 3 h du matin.`,description:`Tu rédiges un runbook de diagnostic et remédiation pour un pipeline batch en retard.`,tasks:[`Définir symptômes, checks, actions, escalade`,`Inclure les liens Airflow / BQ / alerting`,`Prévoir un critère de fin d’incident`],trap:`Sans ordre de checks (Airflow → GCS → BQ), l’astreinte refactorise dbt à 3 h du matin au lieu de relancer la bonne tâche.`,steps:[{title:`Structure`,detail:`Symptômes → Vérifications (ordre) → Actions immédiates → Rollback → Escalade → Post-mortem.`},{title:`Checks`,detail:`1) DAG state Airflow 2) Sensor fichier GCS 3) Slot/erreurs BQ 4) Volume vs J-1 5) Alerte fausse positive.`},{title:`Done incident`,detail:`Données J disponibles avant SLA métier + alerte résolue + ticket Jira créé pour cause racine.`}],questions:[{id:`c2q1`,prompt:`Première vérif utile quand un batch est « late » :`,kind:`mcq`,options:[`Réécrire tout le modèle dbt`,`État du DAG / tâche en échec`,`Changer le KPI métier`,`Supprimer le partitionnement`],accept:[`État du DAG / tâche en échec`],explanation:`On commence par localiser où ça bloque (orchestrateur), pas par refactorer le modèle.`},{id:`c2q2`,prompt:`Un runbook doit toujours inclure (un mot) :`,kind:`short`,accept:[`escalade`,`rollback`,`symptômes`,`symptomes`,`checks`],explanation:`Sans escalade / critères de fin / checks ordonnés, le runbook n’est pas opérable la nuit.`}],modelSolution:`Runbook : Symptômes (SLA manqué) → Checks Airflow/GCS/BQ → Relance ciblée ou skip sensor si fichier OK → Escalade data eng on-call → Ticket RCA. Fin = données OK + alerte clear.`},{id:`jira-epic-1`,tool:`jira`,level:1,title:`Découper l’epic « Mart clients »`,context:`Epic Jira : « Livrer le mart clients pour le dashboard rétention ». L’équipe mélange analyse, dbt et Power BI dans une seule story.`,description:`Tu découpes en stories INVEST avec critères d’acceptation testables et DoD data.`,tasks:[`Proposer 5 stories testables`,`Ajouter critères d’acceptation par story`,`Définir une Definition of Done data commune`],trap:`Une seule story « livrer tout le mart » viole Small/Testable : impossible à demo ni à refuser proprement.`,steps:[{title:`Découpe verticale`,detail:`Ex. : staging CRM → tests DQ → modèle dim_customer → mart rétention → dataset Power BI → UAT métier.`},{title:`INVEST`,detail:`Independent, Negotiable, Valuable, Estimable, Small, Testable. Une story = une démo possible.`},{title:`DoD data`,detail:`Code review, tests dbt passent, doc/lineage à jour, données UAT validées, monitoring basique.`}],questions:[{id:`j1q1`,prompt:`Une story « Faire tout le mart clients » viole surtout quel critère INVEST ?`,kind:`mcq`,options:[`Valuable`,`Small / Testable`,`Negotiable`,`Independent`],accept:[`Small / Testable`],explanation:`Trop grosse = non Small, difficilement Testable en une itération.`},{id:`j1q2`,prompt:`Sigle des critères de qualité d’une user story :`,kind:`short`,accept:[`invest`],explanation:`INVEST = Independent, Negotiable, Valuable, Estimable, Small, Testable.`}],modelSolution:`5 stories : 1) staging CRM + tests not_null/unique 2) dim_customer 3) fct_retention_daily 4) exposition BI 5) UAT KPI. DoD : tests verts, doc, review, UAT sign-off.`},{id:`jira-dod-2`,tool:`jira`,level:2,title:`Definition of Done data & dépendances`,context:`Deux équipes (ingestion et BI) se bloquent mutuellement. Les tickets n’expriment pas les dépendances.`,description:`Tu renforces le DoD et le graphe de dépendances Jira pour fluidifier le flux.`,tasks:[`Écrire un DoD data en 5 bullets`,`Modéliser les liens « blocks / is blocked by »`,`Proposer un champ « Data contract » sur les stories d’interface`],trap:`Sans liens « blocks / is blocked by », la BI démarre avant le mart et tout le monde « attend l’autre » en silence.`,steps:[{title:`DoD`,detail:`Tests auto, qualité (seuils), documentation, droits d’accès, observabilité (alerte volume/nulls).`},{title:`Dépendances`,detail:`Story BI « is blocked by » mart dbt ; epic ingestion « blocks » exposition. Visible sur le board.`},{title:`Data contract`,detail:`Schéma colonnes, SLA fraîcheur, owner — attaché au ticket d’interface entre équipes.`}],questions:[{id:`j2q1`,prompt:`Sans lien de dépendance Jira, le risque principal est :`,kind:`mcq`,options:[`Trop de documentation`,`Travail parallèle sur une interface non prête`,`Trop de tests`,`Trop de KPI`],accept:[`Travail parallèle sur une interface non prête`],explanation:`Les dépendances explicites évitent que la BI construise sur un mart encore instable.`},{id:`j2q2`,prompt:`Élément typique d’un data contract (un mot : schéma / sla / owner) :`,kind:`short`,accept:[`schéma`,`schema`,`sla`,`owner`,`fraîcheur`,`fraicheur`],explanation:`Un contrat data fixe au minimum schéma, fraîcheur (SLA) et ownership.`}],modelSolution:`DoD : tests, seuils DQ, docs, IAM, alerte. Dépendances Jira visibles. Contracts sur tickets d’interface (schéma + SLA + owner).`},{id:`sql-dupes-1`,tool:`sql`,level:1,title:`Détecter les doublons clients`,context:`Le CRM contient des doublons (même email, sociétés orthographiées différemment). Le mart clients surestime le nombre de clients uniques.`,description:`Tu écris une requête SQL de détection de doublons et un taux de duplication.`,tasks:[`Compter les groupes email en doublon`,`Calculer un taux de duplication`,`Traiter le cas des email NULL`],trap:`Les sociétés ne sont pas orthographiées à l’identique (« Acme Retail » vs « ACME Retail », espaces en trop) — normalise avec LOWER/TRIM avant de conclure à un doublon sur le nom seul.`,steps:[{title:`CTE groupes`,detail:`WITH d AS (SELECT lower(trim(email)) AS e, COUNT(*) c FROM clients GROUP BY 1 HAVING COUNT(*) > 1)`},{title:`Taux`,detail:`Taux ≈ (SUM(c) des doublons) / COUNT(*) total — ou % de lignes appartenant à un groupe > 1.`},{title:`NULL`,detail:`Exclure email IS NULL du matching, ou les traiter à part (autre règle : SIRET + nom).`}],questions:[{id:`s1q1`,prompt:`Clause SQL pour ne garder que les groupes avec plus d’une ligne :`,kind:`mcq`,options:[`WHERE COUNT(*) > 1`,`HAVING COUNT(*) > 1`,`LIMIT 2`,`ORDER BY COUNT(*)`],accept:[`HAVING COUNT(*) > 1`],explanation:`HAVING filtre après agrégation ; WHERE ne peut pas utiliser COUNT(*) ainsi.`},{id:`s1q2`,prompt:`Mot-clé pour une sous-requête nommée réutilisable :`,kind:`short`,accept:[`with`,`cte`],explanation:`WITH … AS (…) définit une CTE (Common Table Expression).`},{id:`s1q3`,prompt:`Avant de matcher sur email, on applique souvent :`,kind:`mcq`,options:[`LOWER + TRIM`,`MAX uniquement`,`DROP TABLE`,`FULL OUTER JOIN systématique`],accept:[`LOWER + TRIM`],explanation:`Normaliser (casse, espaces) évite les faux « uniques ».`}],modelSolution:`WITH norm AS (
  SELECT id, NULLIF(LOWER(TRIM(email)), '') AS email_n
  FROM clients
),
dup AS (
  SELECT email_n, COUNT(*) AS c
  FROM norm WHERE email_n IS NOT NULL
  GROUP BY 1 HAVING COUNT(*) > 1
)
SELECT
  (SELECT SUM(c) FROM dup) * 1.0 / (SELECT COUNT(*) FROM norm) AS duplicate_row_rate;`},{id:`sql-window-2`,tool:`sql`,level:2,title:`Window function — dernier statut par contrat`,context:"Table `contract_events(contract_id, event_ts, status)`. Tu dois exposer le statut courant de chaque contrat.",description:`Tu utilises une fonction de fenêtrage pour dédupliquer sur le dernier événement.`,tasks:[`Écrire une requête avec ROW_NUMBER() PARTITION BY contract_id`,`Filtrer rn = 1`,`Expliquer pourquoi ORDER BY event_ts DESC`],trap:`Sans ORDER BY event_ts DESC dans la fenêtre, ROW_NUMBER() te donne une ligne arbitraire — pas forcément le dernier statut.`,steps:[{title:`Partition`,detail:`ROW_NUMBER() OVER (PARTITION BY contract_id ORDER BY event_ts DESC) AS rn`},{title:`Filtre`,detail:`Envelopper en CTE/sous-requête puis WHERE rn = 1.`},{title:`Égalité de timestamps`,detail:`Ajouter une clé de tie-break (event_id) si deux events ont le même ts.`}],questions:[{id:`s2q1`,prompt:`Pour le « dernier » événement, ORDER BY event_ts doit être :`,kind:`mcq`,options:[`ASC`,`DESC`,`Inutile`,`RANDOM`],accept:[`DESC`],explanation:`DESC met le plus récent en rn = 1.`},{id:`s2q2`,prompt:`Nom de la fonction qui numérote les lignes dans une partition :`,kind:`short`,accept:[`row_number`,`row_number()`,`row number`],explanation:`ROW_NUMBER() attribue 1..n dans chaque PARTITION.`}],modelSolution:`WITH ranked AS (
  SELECT *, ROW_NUMBER() OVER (
    PARTITION BY contract_id ORDER BY event_ts DESC, event_id DESC
  ) AS rn
  FROM contract_events
)
SELECT * FROM ranked WHERE rn = 1;`},{id:`py-etl-1`,tool:`python`,level:1,title:`Script CSV → clean → Parquet`,context:`Fichiers CSV quotidiens « landing » à nettoyer avant chargement BigQuery. Pas encore d’orchestrateur lourd.`,description:`Tu conçois un script Python idempotent : lecture, validation schéma, écriture Parquet, logs d’erreur.`,tasks:[`Valider les colonnes attendues`,`Logger les lignes invalides sans faire planter tout le run`,`Écrire un output déterministe (même input → même output)`],trap:`Un append aveugle sur le même fichier/partition du jour crée des doublons au rejeu — overwrite de la partition, pas append.`,steps:[{title:`Schéma`,detail:`Définis EXPECTED_COLS ; si manquantes → fail fast. Types : parse dates, coerce numériques.`},{title:`Lignes sales`,detail:`Sépare valid vs reject (fichier _rejects.csv + compteur). Ne silence pas les erreurs.`},{title:`Idempotence`,detail:`Écris sous un chemin daté/partitionné ; overwrite de la partition du jour, pas append aveugle.`}],questions:[{id:`p1q1`,prompt:`Comportement sain si une colonne obligatoire manque :`,kind:`mcq`,options:[`Ignorer et continuer`,`Fail fast avec message clair`,`Créer la colonne à null sans log`,`Supprimer le fichier source`],accept:[`Fail fast avec message clair`],explanation:`Un schéma cassé = incident data. Mieux vaut échouer tôt que charger n’importe quoi.`},{id:`p1q2`,prompt:`Mot décrivant « même input ⇒ même output / rejouable » :`,kind:`short`,accept:[`idempotent`,`idempotence`,`déterministe`,`deterministe`],explanation:`Idempotence / déterminisme : rejouer le job du jour ne duplique pas ni n’altère au hasard.`}],modelSolution:`read_csv → validate columns → type coerce → split rejects → to_parquet(partition date) overwrite → log metrics (rows_in, rows_out, rejects).`},{id:`py-test-2`,tool:`python`,level:2,title:`Tests unitaires data (pandas)`,context:"Une fonction `normalize_iban` est utilisée dans 3 pipelines. Un bug silencieux a corrompu des IBAN.",description:`Tu poses des tests unitaires ciblés sur les cas limites (espaces, casse, longueur).`,tasks:[`Lister 4 cas de test (happy path + edge)`,`Choisir assert sur sortie attendue`,`Décider fail vs reject pour entrée irrécupérable`],trap:`Normaliser un IBAN invalide « pour que ça passe » corrompt 3 pipelines — better reject/raise que inventer.`,steps:[{title:`Cas`,detail:`OK ; espaces internes ; lowercase ; trop court ; None/NaN ; caractères interdits.`},{title:`Policy`,detail:`Normalisable → clean ; irrécupérable → raise ou flag reject selon contrat (ne pas « inventer »).`},{title:`CI`,detail:`pytest dans le pipeline ; bloquer le merge si tests data red.`}],questions:[{id:`p2q1`,prompt:`Un test unitaire data doit surtout vérifier :`,kind:`mcq`,options:[`La couleur du dashboard`,`Des cas limites et la politique d’erreur`,`Le salaire de l’équipe`,`Le nom du bucket uniquement`],accept:[`Des cas limites et la politique d’erreur`],explanation:`Les bugs data vivent dans les edge cases et le traitement des entrées invalides.`},{id:`p2q2`,prompt:`Framework de test Python le plus courant ici :`,kind:`short`,accept:[`pytest`],explanation:`pytest est le standard de fait pour les tests unitaires Python.`}],modelSolution:`Tests : IBAN valide ; avec espaces → compacté ; lower → upper ; length != attendu → reject/raise ; None → reject. Branch CI rouge = pas de merge.`},{id:`gcs-layout-1`,tool:`gcs`,level:1,title:`Arborescence landing / raw / curated`,context:`Nouveau projet GCP : fichiers partenaires quotidiens. Personne n’a standardisé les préfixes ni la rétention.`,description:`Tu proposes une organisation de buckets/préfixes et une politique de lifecycle.`,tasks:[`Définir préfixes landing, raw, curated`,`Proposer rétention par zone`,`Appliquer le principe du moindre privilège IAM`],trap:`Mélanger landing et curated dans le même préfixe sans dt= rend les sensors Airflow et la rétention impossibles à industrialiser.`,steps:[{title:`Zones`,detail:`landing/ (drop tel quel) → raw/ (archivage immuable) → curated/ (fichiers prêts modèle).`},{title:`Préfixe daté`,detail:`…/dt=YYYY-MM-DD/… pour partitionner et rejouer un jour.`},{title:`Lifecycle`,detail:`Landing courte (ex. 7–14 j) ; raw longue ; curated selon besoin mart. Nearline/Coldline si besoin.`}],questions:[{id:`g1q1`,prompt:`Zone où l’on dépose le fichier partenaire sans transformation :`,kind:`mcq`,options:[`curated`,`landing`,`mart`,`serving`],accept:[`landing`],explanation:`Landing = drop zone brute ; raw archive ; curated = prêt conso.`},{id:`g1q2`,prompt:`Pattern de préfixe pour rejouer un jour (mot-clé) :`,kind:`short`,accept:[`dt=`,`partition`,`date`,`dt`,`yyyy-mm-dd`],explanation:`Un préfixe daté (ex. dt=2026-07-22/) permet rejeu et lifecycle ciblés.`}],modelSolution:`gs://proj-landing/partner/dt=… · gs://proj-raw/… rétention longue · gs://proj-curated/… IAM : writers landing ≠ readers BI curated.`},{id:`csql-incr-1`,tool:`cloudsql`,level:1,title:`Extraction incrémentale (watermark)`,context:"Une table OLTP `orders` (updated_at) doit être extraite chaque nuit vers GCS puis BigQuery, sans full scan quotidien.",description:`Tu conçois une extraction incrémentale basée sur un watermark, avec fenêtre de rejeu.`,tasks:[`Définir le watermark updated_at`,`Prévoir une fenêtre de lookback (late arriving)`,`Estimer l’impact charge sur l’instance`],trap:`Sans fenêtre de lookback, les updates tardives (updated_at après le watermark) ne remontent jamais dans BigQuery.`,steps:[{title:`Watermark`,detail:`Stocker last_success_ts ; SELECT * WHERE updated_at >= last_success_ts - lookback.`},{title:`Lookback`,detail:`Ex. 2–3 jours pour rattraper les updates tardives ; fusion (merge) en aval sur clé primaire.`},{title:`Charge`,detail:`Index sur updated_at ; extractions hors pic ; éviter SELECT * massif sans filtre.`}],questions:[{id:`cs1q1`,prompt:`Colonne typique pour l’incrémental :`,kind:`mcq`,options:[`updated_at`,`couleur_ui`,`nom_fichier_pdf`,`random_uuid uniquement`],accept:[`updated_at`],explanation:`updated_  CTE qui agrège le CA, puis tu filtres le top.`,tasks:[`WITH ca AS (SUM montant_ht WHERE livree GROUP BY magasin)`,`SELECT top 3 ORDER BY ca DESC`,`Commenter le grain`],trap:`ORDER BY sans LIMIT (ou QUALIFY) renvoie tout — le « top » n’est pas garanti côté conso.`,steps:[{title:`CTE`,detail:`WITH ca AS (SELECT magasin, SUM(montant_ht) AS ca_ht FROM ventes WHERE statut = 'livree' GROUP BY 1)`},{title:`Top`,detail:`SELECT * FROM ca ORDER BY ca_ht DESC LIMIT 3`}],questions:[{id:`s3q1`,prompt:`Mot-clé SQL pour factoriser une sous-requête nommée :`,kind:`short`,accept:[`with`,`cte`],explanation:`WITH … AS (…) = Common Table Expression.`},{id:`s3q2`,prompt:`Filtrer statut livree se fait avec :`,kind:`mcq`,options:[`WHERE`,`HAVING uniquement`,`ORDER BY`,`UNION`],accept:[`WHERE`],explanation:`WHERE filtre les lignes avant agrégation ; HAVING après.`}],modelSolution:`\`\`\`sql

  SELECT magasin, SUM(montant_ht) AS ca_ht

\`\`\``},{id:`sql-null-4`,tool:`sql`,level:2,title:`NULL-safe — COALESCE / NULLIF emails`,context:`Le CRM Mutualis mélange NULL, chaînes vides et « unknown ».`,description:`Tu normalises les emails en SQL avant dédoublonnage.`,tasks:[`NULLIF(TRIM(email), '')`,`COALESCE / filtre unknown`,`GROUP BY email normalisé`],trap:`TRIM seul ne transforme pas NULL — et '' <> NULL en SQL.`,steps:[{title:`Normaliser`,detail:`LOWER(TRIM(email)) puis NULLIF(..., '')`},{title:`Exclure`,detail:`WHERE email_n IS NOT NULL AND email_n <> 'unknown'`}],questions:[{id:`s4q1`,prompt:`NULLIF(x, '') renvoie NULL si x est :`,kind:`mcq`,options:[`chaîne vide`,`toujours NULL`,`0`,`unknown`],accept:[`chaîne vide`],explanation:`NULLIF(a,b) → NULL quand a = b.`}],modelSolution:`\`\`\`sql
SELECT LOWER(TRIM(email)) AS email_n, COUNT(*)
FROM clients_doublons
WHERE NULLIF(LOWER(TRIM(email)), '') IS NOT NULL
  AND LOWER(TRIM(email)) <> 'unknown'
GROUP BY 1
HAVING COUNT(*) > 1;

SELECT
  jour,
  footfall,
  LAG(footfall) OVER (ORDER BY jour) AS prev_footfall,
  footfall - LAG(footfall) OVER (ORDER BY jour) AS delta,

FROM capteur_a_retail;

class CsvCleaner:
    def __init__(self, expected: set[str]):
        self.expected = expected
        self.rejects_count = 0

    def clean(self, df):
        missing = self.expected - set(df.columns)
        if missing:
            raise ValueError(f"missing {missing}")
        ok = df.dropna(subset=list(self.expected))
        self.rejects_count = len(df) - len(ok)
        return ok

 approche MDM est la plus correcte en gouvernance data pour les emails en doublon ?`,options:[`Supprimer aléatoirement une ligne sur deux sans règle de survie`,`Clé normalisée (email) + règle de survivorship + Owner/Steward CRM documentés`,`Ignorer les doublons tant que le CA « a l’air bon »`],correctIndex:1,damaRef:`Référentiel gouvernance · Ch.10 Reference & Master Data`,correction:`Ch.10 MDM : matching (exact/fuzzy), golden record / trusted version, règles de survivorship, stewardship dédié. Sans politique, le hub ou le script ne « gouverne » rien.`}),"l1-join":N({link:`Une jointure CA × clients engage grain et linéage du KPI finance.`,question:`Quel énoncé décrit le mieux grain + linéage pour « CA livré par segment » ?`,options:[`Grain = une ligne Excel quelconque ; linéage inutile si le JOIN « marche »`,`Grain = segment × période ; linéage ventes + clients_ref → mart documenté au catalogue`,`Grain = pixel du dashboard ; linéage = nom du fichier Power BI seulement`],correctIndex:1,damaRef:`Référentiel gouvernance · Ch.12 Metadata (lineage) · Ch.11 DW/BI (grain)`,correction:`Le grain (Kimball/gouvernance data DW-BI) doit être explicite. Le linéage (Metadata) trace sources → transformations → produit data. Sans les deux, pas de « single version of truth » gouvernée.`}),"l1-py-clean":N({link:`Industrialiser le nettoyage = politique de qualité versionnée, pas un one-shot.`,question:`Où versionner et qui valide un changement de règle de normalisation email ?`,options:[`Uniquement en local sur le laptop, sans revue`,`Dans le repo (code + doc) avec PR revue Steward/Owner métier`,`Uniquement oralement en daily Scrum`],correctIndex:1,damaRef:`Référentiel gouvernance · Ch.13 Data Quality · Ch.3 Data Governance`,correction:`Les règles de qualité sont des actifs gouvernés : traçabilité du changement (qui a décidé quoi) fait partie de la DG. Code + documentation + accountability Owner/Steward = pratique de gouvernance data.`}),"l2-sql":N({link:`Un agrégat publié exige classi  transform → check).`,`Run it until you get the expected result.`,`Paste the full Python code into the game pad.`],withoutAccount:"No Databricks: install Python 3 + pandas (`pip install pandas`) or Google Colab. Then paste the script here."},spark:{toolId:`spark`,platformLabel:`Databricks Free Edition (PySpark)`,freePath:!0,signupUrl:`https://login.databricks.com/signup?provider=DB_FREE_TIER`,signupLabel:`Create Databricks Free Edition`,accountSteps:[`Sign up for Databricks Free Edition if not already done.`,`Create a Python notebook — the runtime provides Spark.`],firstUseSteps:["Check Spark: `spark.version` in a cell.",'Load a small CSV into a DataFrame: `spark.read.option("header", True).csv(...)`.',"Use `.show()` and `.printSchema()` to inspect."],taskSteps:[`Implement the Spark transforms (filter, groupBy, join…).`,"Verify with `.show()` / count.",`Paste the PySpark code into the game pad.`],withoutAccount:`No cloud account: write PySpark in the pad (the game validates the text). Free Edition is the easiest path to run it later.`},databricks:{toolId:`databricks`,platformLabel:`Databricks Free Edition`,freePath:!0,signupUrl:`https://login.databricks.com/signup?provider=DB_FREE_TIER`,signupLabel:`Create Databricks Free Edition`,accountSteps:[`Sign up for Databricks Free Edition.`,`Confirm your email and open the provided workspace.`,`Browse Workspace, Catalog, Jobs (as available on Free Edition).`],firstUseSteps:[`Create a Mutualis folder in Workspace.`,`Create one SQL and one Python notebook on the same sample dataset.`,`If Jobs is available: schedule a simple notebook run.`],taskSteps:[`Perform the requested action (notebook, job, Delta / catalog as briefed).`,`Document in 3 lines what you clicked + paste code / config into the pad.`],withoutAccount:`The game accepts a text deliverable describing the flow (optional screenshots). Create Free Edition as soon as you can for real practice.`},gcs:{toolId:`gcs`,platformLabel:`Google Cloud Storage (GCP trial)`,freePat
